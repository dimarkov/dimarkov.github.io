---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    <p class="pub-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y-%m-%d" }}
      </time>
      {% if page.tags %}
        · {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      {% endif %}
    </p>
  </header>
  <section>
    {{ content }}
  </section>
</article>
