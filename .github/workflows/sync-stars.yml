name: sync github stars

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: write               # to commit refreshed _data/projects.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@v8

      - name: refresh star counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run .github/scripts/sync_stars.py

      - name: commit if changed
        run: |
          if [[ -n "$(git status --porcelain _data/projects.yml)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/projects.yml
            git commit -m "chore: refresh github star counts"
            git push
          else
            echo "no changes in _data/projects.yml"
          fi
